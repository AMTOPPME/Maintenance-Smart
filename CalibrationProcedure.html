  <style>
    :root {
      --bg: #f3f4f6;
      --card-bg:#ffffff;
      --border-subtle:#e5e7eb;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #111827;
      --text-soft: #6b7280;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background:
        radial-gradient(circle at top, rgba(129,140,248,0.12), transparent),
        var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      -webkit-text-size-adjust: 100%;
      transition: background .25s ease, color .25s ease;
    }

    /* style 背景—與主頁同步 */
    html[data-style="panther"] body{
      background:
        radial-gradient(circle at top,rgba(244,114,182,.28),transparent),
        var(--bg);
    }
    html[data-style="hangyodon"] body{
      background:
        radial-gradient(circle at top,rgba(56,189,248,.35),transparent),
        var(--bg);
    }

    /* Back to Top 按鈕外觀 */
    #backToTop {
      position: fixed;
      bottom: 22px;
      right: 190px;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 22px;
      font-weight: bold;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      z-index: 9999;
      transition: all .25s ease;
    }
    #backToTop:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 28px rgba(0,0,0,0.30);
    }

    /* panther → 使用粉紅角色圖片 */
    html[data-style="panther"] #backToTop {
      background: transparent;
      background-image: url("assets/pinkpanther2.png");
      background-size: 100% 100%;
      background-position: center;
      color: transparent;
      border: none;
    }

    /* hangyodon → 使用魚丁角色圖片 */
    html[data-style="hangyodon"] #backToTop {
      background: transparent;
      background-image: url("assets/hangyodon2.png");
      background-size: 100% 100%;
      background-position: center;
      color: transparent;
      border: none;
    }

    /* 角色背景（左右兩側大圖） */
    .side-panther,
    .side-hangyodon{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      width:320px;
      opacity:.9;
      z-index:1;
      pointer-events:none;
      user-select:none;
      transition: transform .25s ease, opacity .25s ease;
      display:none;
    }

    .side-panther.left{left:1.5%; transform:translateY(-50%) scaleX(1);}
    .side-panther.right{right:1.5%; transform:translateY(-50%) scaleX(1);}

    .side-hangyodon.left{left:1.5%; transform:translateY(-50%) scaleX(-1);}
    .side-hangyodon.right{right:1.5%; transform:translateY(-50%) scaleX(-1);}

    html[data-style="hangyodon"] .side-hangyodon{display:block;}

  <!-- Back To Top：同時控制主頁 + 內嵌 pdf.js viewer -->
  <script>
    (function(){
      const btn   = document.getElementById('backToTop');
      const frame = document.getElementById('pdfFrame');
      if (!btn) return;

      const MAIN_THRESHOLD = 120;
      const PDF_THRESHOLD  = 80;

      function showBtn() { btn.style.display = 'flex'; }
      function hideBtn() { btn.style.display = 'none'; }

      function handleMainScroll() {
        if (window.scrollY > MAIN_THRESHOLD) {
          showBtn();
        } else {
          hideBtn();
        }
      }
      window.addEventListener('scroll', handleMainScroll);

      function scrollPdfToTop() {
        if (!frame || !frame.contentWindow) return;
        try{
          const cw = frame.contentWindow;
          const doc = cw.document;
          const container = doc.getElementById('viewerContainer');

          if (container && typeof container.scrollTo === 'function') {
            container.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (typeof cw.scrollTo === 'function') {
            cw.scrollTo(0, 0);
          }
        }catch(e){}
      }

      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
        scrollPdfToTop();
      });

      function attachPdfScrollListener() {
        if (!frame || !frame.contentWindow) return;
        try{
          const cw   = frame.contentWindow;
          const doc  = cw.document;
          const cont = doc.getElementById('viewerContainer');

          const target = cont || cw;
          if (!target) return;

          target.addEventListener('scroll', () => {
            try{
              const top = cont ? cont.scrollTop : cw.scrollY || cw.pageYOffset || 0;
              if (top > PDF_THRESHOLD) {
                showBtn();
              } else if (window.scrollY <= MAIN_THRESHOLD) {
                hideBtn();
              }
            }catch(e){}
          });
        }catch(e){}
      }

      if (frame){
        frame.addEventListener('load', () => {
          setTimeout(attachPdfScrollListener, 800);
        });
      }
    })();
  </script>

// ✅ iPad / iPadOS 偵測（含 iPad 開桌面版：MacIntel + touch）
function isIPadOS(){
  const ua = navigator.userAgent || "";
  return /iPad|iPhone|iPod/.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const isSmallScreen = window.innerWidth <= 1024;

// ✅ 規則：iPad 一律不用 PDF.js；其他手機/平板也用 fallback；桌機才用 PDF.js
const useFallback = isIPadOS() || (isTouch && isSmallScreen);

if (useFallback) {
  if (openNewTab) openNewTab.style.display = 'none';
  if (viewer) {
    viewer.innerHTML = `
      <div class="fallback">
        Tap the button below to open<br><strong>${docInfo.title}</strong> PDF.<br><br>

  }
  return;
}
