<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inteplast Quality Policy | Maintenance ONE</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 套用主頁 style（blue / panther / hangyodon） -->
  <script>
    (function () {
      const style = localStorage.getItem('ms-style') || 'blue';
      document.documentElement.setAttribute('data-style', style);
    })();
  </script>

  <style>
    :root{
      --bg:#f3f4f6;
      --glass: rgba(255,255,255,.72);
      --glass2: rgba(255,255,255,.52);
      --text: #111827;
      --muted:#6b7280;
      --shadow: 0 12px 36px rgba(0,0,0,.12);
      --radius: 18px;
      --hint: #6b7280;
      --bgimg: none;           /* JS 注入 */
      --bgimg-opacity: .55;    /* 可調：0.35~0.75 */
    }


/* body 保留素色與 radial，另外用 ::before 疊時間背景圖 */
body{
  margin:0;
  background:
    radial-gradient(circle at top, rgba(129,140,248,0.12), transparent),
    var(--bg);
  display:flex;
  align-items:center;
  justify-content:center;
  height:100vh;
  padding:0;
  overflow:hidden;
  position:relative;
  font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
  color:var(--text);
}

/* ✅ 疊早/中/晚背景圖（所有風格都會用） */
body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;                 /* ✅ 最穩：永遠在最底 */
  background-image: var(--bgimg);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  opacity: var(--bgimg-opacity);
  filter: saturate(1.05) contrast(1.02);
  transform: scale(1.03);
  pointer-events:none;
}

/* 你原本 page/topbar 需要在背景之上 */
.page{ position:relative; z-index:2; }

/* ✅ 確保你的內容在背景圖上面 */
.confetti-wrap{ z-index:20; }
.home-image{ z-index:2; }
.toast{ z-index:30; }
.fab{ z-index:25; }
.time-hint{ z-index:24; }
.help{ z-index:9999; }



    /* Home 圖片 */
    .home-image{
      max-width:min(980px, 92vw);
      max-height:86vh;
      border-radius:var(--radius);
      box-shadow:var(--shadow);
      object-fit:contain;
      position:relative;
      z-index:2;
      cursor:pointer;
      -webkit-tap-highlight-color: transparent;
      transition: transform .18s ease, filter .18s ease, box-shadow .25s ease; /* ✅ A */
    }
    .home-image:active{
      transform: scale(.992);
    }

    /* ✅ A：桌機 hover 微浮起（手機不觸發 hover） */
    @media (hover:hover){
      .home-image:hover{
        transform: translateY(-6px) scale(1.01);
        box-shadow: 0 18px 40px rgba(0,0,0,.18);
        filter: saturate(1.03);
      }
    }

    /* 小提示 Toast */
    .toast{
      position:fixed;
      left:50%;
      bottom:22px;
      transform: translateX(-50%) translateY(12px);
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: 0 12px 30px rgba(15,23,42,.14);
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 13px;
      color: var(--text);
      z-index: 30;
      opacity: 0;
      pointer-events:none;
      transition: opacity .18s ease, transform .18s ease;
      backdrop-filter: blur(10px);
      display:flex;
      gap:10px;
      align-items:center;
      max-width: 92vw;
      white-space: nowrap;
      overflow:hidden;
      text-overflow: ellipsis;
    }
    .toast.show{
      opacity:1;
      transform: translateX(-50%) translateY(0);
    }
    .pill{
      font-size: 11px;
      color: var(--muted);
      background: var(--glass2);
      border: 1px solid rgba(255,255,255,.6);
      padding: 2px 8px;
      border-radius: 999px;
    }

    /* 右下角控制器（只留 FX） */
    .fab{
      position:fixed;
      right:14px;
      bottom:14px;
      z-index:25;
      display:flex;
      gap:10px;
      align-items:flex-end;
    }
    .fab button{
      border:none;
      cursor:pointer;
      border-radius: 14px;
      padding: 10px 12px;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: 0 10px 24px rgba(15,23,42,.12);
      backdrop-filter: blur(10px);
      font-size: 12px;
      color: var(--text);
      display:flex;
      gap:8px;
      align-items:center;
      transition: transform .15s ease;
    }
    .fab button:active{ transform: scale(.98); }
    .dot{
      width:10px; height:10px; border-radius:999px;
      background: rgba(37,99,235,.9);
      box-shadow: 0 0 0 3px rgba(37,99,235,.16);
    }


    /* Confetti（輕量 DOM 粒子） */
    .confetti-wrap{
      position:fixed;
      inset:0;
      z-index:20;
      pointer-events:none;
      overflow:hidden;
    }
    .confetti{
      position:absolute;
      width:10px; height:14px;
      border-radius: 3px;
      opacity:.95;
      transform: translate(-50%,-50%) rotate(0deg);
      animation: fall var(--dur) linear forwards;
      filter: drop-shadow(0 10px 18px rgba(0,0,0,.12));
    }
    @keyframes fall{
      0%{ transform: translate(var(--x0), var(--y0)) rotate(0deg); }
      100%{ transform: translate(var(--x1), 110vh) rotate(540deg); }
    }

    /* Help overlay */
    .help{
      position:fixed;
      top: calc(14px + env(safe-area-inset-top));
      right: 14px;
      left: auto;
      z-index: 9999;
      background: var(--glass);
      border: 1px solid rgba(255,255,255,.65);
      box-shadow: 0 10px 24px rgba(15,23,42,.12);
      backdrop-filter: blur(10px);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 12px;
      color: var(--muted);
      max-width: 320px;
      line-height: 1.45;
      display:none;
    }
    body[data-help="1"] .help{ display:block; }

    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono","Courier New", monospace;
      font-size: 11px;
      color: var(--text);
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.7);
      padding: 1px 6px;
      border-radius: 8px;
    }

    /* ✅ C：左下角時間提示 */
    .time-hint{
      position:fixed;
      left:16px;
      bottom:16px;
      z-index:24;
      font-size:12px;
      color:var(--hint);
      opacity:.75;
      pointer-events:none;
      user-select:none;
      text-shadow: 0 1px 0 rgba(255,255,255,.45);
    }

    @media (max-width: 520px){
      .help{ max-width: 86vw; }
      .fab button{ padding: 10px 11px; }
    }
  </style>
</head>

<body>
  <!-- Confetti 容器 -->
  <div class="confetti-wrap" id="confettiWrap"></div>

  <!-- Help -->
  <div class="help" id="helpBox">
    <div style="font-weight:600; color:var(--text); margin-bottom:6px;">Shortcuts</div>
    <div><span class="kbd">Click</span> Home image = confetti</div>
    <div><span class="kbd">H</span> = Toggle this help</div>
    <div><span class="kbd">Type</span> <span class="kbd">m</span><span class="kbd">o</span> = Easter egg</div>
    <div><span class="kbd">Esc</span> = Close help</div>
  </div>



  <!-- 🌟 Home 圖片 -->
  <img src="assets/home.png" alt="Home" class="home-image" id="homeImage">

  <!-- Toast -->
  <div class="toast" id="toast">
    <span class="pill" id="toastPill">MO</span>
    <span id="toastText">Ready</span>
  </div>

  <!-- ✅ C：時間提示 -->
  <div class="time-hint" id="timeHint"></div>

  <!-- 右下角控制器：只留 FX -->
  <div class="fab">
    <button id="toggleFxBtn" type="button" title="Toggle effects">
      <span class="dot"></span>
      <span id="fxLabel">FX: ON</span>
    </button>
  </div>

  <script>
    // ---------- helpers ----------
    const $ = (id) => document.getElementById(id);
    const root = document.documentElement;

    function getTheme(){
      return root.getAttribute("data-style") || "blue";
    }

    // ---------- toast ----------
    let toastTimer = null;
    function toast(pill, msg){
      const el = $("toast");
      $("toastPill").textContent = pill;
      $("toastText").textContent = msg;
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => el.classList.remove("show"), 1800);
    }

    // ---------- FX toggle ----------
    const FX_KEY = "ms-home-fx";
    let fxOn = (localStorage.getItem(FX_KEY) ?? "1") === "1";
    function setFx(on){
      fxOn = !!on;
      localStorage.setItem(FX_KEY, fxOn ? "1" : "0");
      $("fxLabel").textContent = fxOn ? "FX: ON" : "FX: OFF";
      toast("FX", fxOn ? "Effects enabled" : "Effects disabled");
    }
    function themeColors(){
      return ["#2563eb","#6366f1","#60a5fa","#a78bfa","#22c55e"];
    }
    // ---------- confetti ----------
    const wrap = $("confettiWrap");
    let lastBurst = 0;
    function burstConfetti(x, y){
      if (!fxOn) return;

      const now = Date.now();
      if (now - lastBurst < 220) return; // 節流
      lastBurst = now;

      const colors = themeColors();
      const count = window.matchMedia("(max-width: 520px)").matches ? 18 : 28;

      for (let i = 0; i < count; i++){
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.background = colors[(Math.random() * colors.length) | 0];

        const drift = (Math.random() * 240 - 120);
        const dur = (Math.random() * 900 + 900) | 0;

        c.style.setProperty("--x0", `${x}px`);
        c.style.setProperty("--y0", `${y}px`);
        c.style.setProperty("--x1", `${x + drift}px`);
        c.style.setProperty("--dur", `${dur}ms`);

        const w = (Math.random() * 6 + 7);
        const h = (Math.random() * 10 + 10);
        c.style.width = `${w}px`;
        c.style.height = `${h}px`;

        wrap.appendChild(c);
        setTimeout(() => c.remove(), dur + 100);
      }
    }

    // ---------- help ----------
    function toggleHelp(force){
      const cur = document.body.getAttribute("data-help") === "1";
      const next = typeof force === "boolean" ? force : !cur;
      document.body.setAttribute("data-help", next ? "1" : "0");
      if (next) toast("Help", "Shortcuts shown");
    }
    // ✅ Time-based background (morning/noon/night) for ALL styles
(function(){
  function applyTimeBackground(){
    const h = new Date().getHours();

    const morning = new URL('assets/bg_morning.png', location.href).href;
    const noon    = new URL('assets/bg_noon.png', location.href).href;
    const night   = new URL('assets/bg_night.png', location.href).href;
    
    let src = morning;                    // 05:00–11:59
    if (h >= 12 && h < 18) src = noon;    // 12:00–17:59
    else if (h >= 18 || h < 5) src = night; // 18:00–04:59
    console.log("bg:", src);
    document.documentElement.style.setProperty('--bgimg', `url("${src}")`);
  }

  applyTimeBackground();
  setInterval(applyTimeBackground, 60 * 1000);
})();
    // ---------- ✅ C: time hint ----------
    function updateTimeHint(){
      const h = new Date().getHours();
      let msg = "Maintenance ONE";
      if (h < 12) msg = "Good Morning — Maintenance ONE";
      else if (h < 18) msg = "Good Afternoon — Maintenance ONE";
      else msg = "Good Evening — Maintenance ONE";

      const el = $("timeHint");
      el.textContent = msg;

      // ✅ 永遠白色
      el.style.color = "#ffffff";
      el.style.textShadow = "0 2px 6px rgba(0,0,0,.45)"; // 防止亮背景吃掉
    }

    // ---------- events ----------
    const img = $("homeImage");

    // click => confetti (中心點)
    img.addEventListener("click", () => {
      const rect = img.getBoundingClientRect();
      burstConfetti(rect.left + rect.width * 0.5, rect.top + rect.height * 0.45);
    });

    // pointerdown => confetti from pointer position
    img.addEventListener("pointerdown", (e) => {
      burstConfetti(e.clientX, e.clientY);
    });

    $("toggleFxBtn").addEventListener("click", () => setFx(!fxOn));

    // keyboard easter egg: "mo"
    let buffer = "";
    window.addEventListener("keydown", (e) => {
      const k = e.key.toLowerCase();

      if (k === "h"){
        toggleHelp();
        return;
      }
      if (k === "escape"){
        toggleHelp(false);
        return;
      }

      if (k.length === 1 && /[a-z0-9]/.test(k)){
        buffer = (buffer + k).slice(-2);
        if (buffer === "mo"){
          toast("Easter", "Maintenance ONE ✨");
          if (fxOn){
            document.querySelectorAll(".side-panther,.side-hangyodon").forEach(el=>{
              const prev = el.style.transform;
              el.style.transform = (prev ? prev + " " : "") + "translateY(-6px)";
              setTimeout(()=>{ el.style.transform = prev; }, 180);
            });
          }
        }
      }
    });

    // init
    setFx(fxOn);
    updateTimeHint();
    toast("MO", "Inteplast Quality Policy loaded");
    // 點 help 卡片外面就關閉
    document.addEventListener("pointerdown", (e) => {
      const helpOn = document.body.getAttribute("data-help") === "1";
      if (!helpOn) return;

      const box = $("helpBox");
      if (!box.contains(e.target)) toggleHelp(false);
    }, { capture: true });
    (function(){

  // 初次套用 + 每分鐘刷新（跨時段自動換）
  applyTimeBackground();
  setInterval(applyTimeBackground, 60 * 1000);
})();
  </script>
</body>
</html>
