<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | Maintenance Smart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 套用主頁 style（blue / panther / hangyodon） -->
  <script>
    (function () {
      const style = localStorage.getItem('ms-style') || 'blue';
      document.documentElement.setAttribute('data-style', style);
    })();
  </script>

  <style>
    :root{ --bg:#f3f4f6; }

    html[data-style="panther"]{ --bg:#ffe4ec; }
    html[data-style="hangyodon"]{ --bg:#dbeafe; }

    body{
      margin:0;
      background:
        radial-gradient(circle at top, rgba(129,140,248,0.12), transparent),
        var(--bg);
      display:flex;
      align-items:center;
      justify-content:center;
      height:100vh;
      overflow:hidden;
      position:relative;
    }

    html[data-style="panther"] body{
      background:
        radial-gradient(circle at top,rgba(244,114,182,0.28),transparent),
        var(--bg);
    }
    html[data-style="hangyodon"] body{
      background:
        radial-gradient(circle at top,rgba(56,189,248,0.35),transparent),
        var(--bg);
    }

    /* 左右角色 */
    .side-panther,
    .side-hangyodon{
      position:fixed;
      top:50%;
      transform:translateY(-50%);
      width:320px;
      opacity:.9;
      z-index:1;
      pointer-events:none;
      user-select:none;
      display:none;
    }

    .side-panther.left{ left:1.5%; }
    .side-panther.right{ right:1.5%; }

    .side-hangyodon.left{ left:1.5%; transform:translateY(-50%) scaleX(-1); }
    .side-hangyodon.right{ right:1.5%; transform:translateY(-50%) scaleX(-1); }

    html[data-style="panther"] .side-panther{ display:block; }
    html[data-style="hangyodon"] .side-hangyodon{ display:block; }

    @media (max-width:900px){
      html[data-style="panther"] .side-panther.left,
      html[data-style="hangyodon"] .side-hangyodon.left{
        display:none !important;
      }

      html[data-style="panther"] .side-panther.right,
      html[data-style="hangyodon"] .side-hangyodon.right{
        display:block !important;
        position:fixed !important;
        left:50% !important;
        right:auto !important;
        top:50% !important;
        transform:translate(-50%,-50%) !important;
        width:260px;
        opacity:.7;
      }
    }

    /* ===== 翻轉圖片（電腦/手機都穩） ===== */
    .flip-wrap{
      position:relative;
      z-index:5;
      cursor:pointer;

      /* ✅ 永遠有尺寸（不會因 absolute 變成 0 高度） */
      width: min(92vw, 980px);
      aspect-ratio: 16 / 9;   /* 需要不同比例我也能幫你改 */
      max-height: 90vh;

      perspective:1200px;

      border-radius:18px;
      box-shadow:0 8px 24px rgba(0,0,0,.15);
      overflow:hidden;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* ✅ 圖片填滿容器 */
    .flip-wrap img{
      width:100%;
      height:100%;
      object-fit:contain;

      position:absolute;
      inset:0;

      backface-visibility:hidden;
      transform-style:preserve-3d;
      transition:transform .8s cubic-bezier(.4,.2,.2,1);

      /* ✅ 關鍵：避免點擊被 img 吃掉/拖曳干擾 */
      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .flip-wrap .front{ transform:rotateY(0deg); }
    .flip-wrap .back{ transform:rotateY(180deg); }

    .flip-wrap.flipped .front{ transform:rotateY(-180deg); }
    .flip-wrap.flipped .back{ transform:rotateY(0deg); }

    /* 手機更好看一點：避免過扁 */
    @media (max-width:900px){
      .flip-wrap{
        width: 92vw;
        aspect-ratio: 4 / 5; /* 手機比較像海報比例；不想要可刪掉這行 */
      }
    }
  </style>
</head>

<body>

  <!-- 角色背景 -->
  <img src="assets/pinkpanther1.png" class="side-panther left" alt="">
  <img src="assets/pinkpanther2.png" class="side-panther right" alt="">
  <img src="assets/hangyodon1.png" class="side-hangyodon left" alt="">
  <img src="assets/hangyodon2.png" class="side-hangyodon right" alt="">

  <!-- 翻轉圖片 -->
  <div class="flip-wrap" id="homeFlip" role="button" tabindex="0" aria-label="Flip home image">
    <img src="assets/home.png" class="front" alt="Home">
    <img src="assets/home-2.png" class="back" alt="Home 2">
  </div>

  <script>
    const flip = document.getElementById('homeFlip');

    function toggleFlip(){
      flip.classList.toggle('flipped');
    }

    flip.addEventListener('click', toggleFlip);

    // 也支援鍵盤 Enter/Space
    flip.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleFlip();
      }
    });
  </script>

</body>
</html>
