<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Home | Maintenance Smart</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- 套用主題 -->
  <script>
    (function () {
      const style = localStorage.getItem('ms-style') || 'blue';
      document.documentElement.setAttribute('data-style', style);
    })();
  </script>

  <style>
    :root{
      --bg:#f3f4f6;
      --card-bg:#ffffffcc;
      --radius:22px;
    }

    html[data-style="panther"]{ --bg:#ffe4ec; }
    html[data-style="hangyodon"]{ --bg:#dbeafe; }

    body{
      margin:0;
      background:
        radial-gradient(circle at top, rgba(129,140,248,.12), transparent),
        var(--bg);
      min-height:100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont;
    }

    /* ===== Page Layout ===== */
    .page{
      padding:24px 18px 40px;
      max-width:1100px;
      margin:auto;
    }

    .page h1{
      margin:6px 0 2px;
      font-size:26px;
    }

    .page p{
      margin:0 0 18px;
      color:#6b7280;
    }

    /* ===== Card ===== */
    .card{
      background:var(--card-bg);
      border-radius:28px;
      padding:22px;
      box-shadow:0 18px 40px rgba(0,0,0,.08);
    }

    /* ⭐⭐⭐ 關鍵：Home 內容置中容器 ⭐⭐⭐ */
    .home-center{
      width:100%;
      min-height:60vh;

      display:flex;
      align-items:center;
      justify-content:center;
    }

    /* ===== 翻轉圖片 ===== */
    .flip-wrap{
      width:min(92vw, 900px);
      aspect-ratio: 16 / 9;
      max-height:80vh;

      position:relative;
      cursor:pointer;
      perspective:1200px;

      border-radius:18px;
      overflow:hidden;
      box-shadow:0 10px 26px rgba(0,0,0,.15);
    }

    .flip-wrap img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:contain;

      backface-visibility:hidden;
      transform-style:preserve-3d;
      transition:transform .8s cubic-bezier(.4,.2,.2,1);

      pointer-events:none;
      user-select:none;
      -webkit-user-drag:none;
    }

    .flip-wrap .front{ transform:rotateY(0deg); }
    .flip-wrap .back{ transform:rotateY(180deg); }

    .flip-wrap.flipped .front{ transform:rotateY(-180deg); }
    .flip-wrap.flipped .back{ transform:rotateY(0deg); }

    /* 手機比例 */
    @media (max-width:900px){
      .flip-wrap{
        aspect-ratio:4 / 5;
      }
    }
  </style>
</head>

<body>

  <div class="page">
    <h1>Home</h1>
    <p>Welcome to Maintenance Smart.</p>

    <div class="card">

      <!-- ✅ 一定要有這層 -->
      <div class="home-center">

        <div class="flip-wrap" id="homeFlip" role="button" tabindex="0">
          <img src="assets/home.png" class="front" alt="Home">
          <img src="assets/home-2.png" class="back" alt="Home second">
        </div>

      </div>

    </div>
  </div>

  <script>
    const flip = document.getElementById('homeFlip');

    function toggleFlip(){
      flip.classList.toggle('flipped');
    }

    flip.addEventListener('click', toggleFlip);

    flip.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){
        e.preventDefault();
        toggleFlip();
      }
    });
  </script>

</body>
</html>
