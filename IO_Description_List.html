  <!-- Apply theme & style from portal -->
  <script>
    (function () {
      const storedTheme = localStorage.getItem('ms-theme');
      const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = storedTheme || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);

      const style = localStorage.getItem('ms-style') || 'blue';
      document.documentElement.setAttribute('data-style', style);
    })();

<script>
  // Back to Top
  (function(){
    const btn = document.getElementById('backToTop');
    if (!btn) return;

    const THRESHOLD = 250;
    function updateVisibility() {
      if (window.scrollY > THRESHOLD) btn.classList.add('visible');
      else btn.classList.remove('visible');
    }
    btn.addEventListener('click', ()=>window.scrollTo({ top: 0, behavior: 'smooth' }));
    window.addEventListener('scroll', updateVisibility);
    updateVisibility();
  })();
</script>

<script>
  // ===== Config =====
  const INDEX_URL = "./IODescriptionList/index.json";

  // ===== State =====
  let indexData = null;
  let rowsAll = [];
  let header = [];
  let sortKey = null;
  let sortAsc = true;

  const $ = (s)=>document.querySelector(s);

  function isEmptyCell(v){
  return v == null || String(v).trim() === "";
}
function countNonEmpty(row){
  return row.reduce((n, c) => n + (!isEmptyCell(c) ? 1 : 0), 0);
}
function padRows(rows){
  const maxCols = Math.max(...rows.map(r => r.length));
  return rows.map(r => {
    const rr = r.slice();
    while (rr.length < maxCols) rr.push("");
    return rr;
  });
}

// ✅ 找標題列（像：F16\BIT.DOC、只有一格有內容）
function detectTitleRowIndex(rows){
  if (!rows.length) return -1;
  const r0 = rows[0];
  const nonEmpty = r0.filter(c => !isEmptyCell(c));
  if (nonEmpty.length === 1) {
    const t = String(nonEmpty[0]).trim();
    // 你這種標題常見特徵：含 \ 或 .DOC/.XLS/…
    if (/\\|\.doc|\.xls|\.csv|\.txt/i.test(t)) return 0;
  }
  return -1;
}

// ✅ 找表頭列（通常是 PLC ADR / COMMENT 那一列）
function detectHeaderRowIndex(rows, startIdx){
  for (let i = startIdx; i < rows.length; i++){
    const row = rows[i];
    // 至少兩個非空欄位，且不像純資料(B0,B1...)那樣
    if (countNonEmpty(row) >= 2) return i;
  }
  return startIdx; // fallback
}

/**
 * rows: 2D array (已經 parse 好 CSV 的結果)
 * tableEl: <table> element
 */
function renderLikeExcel(rows, tableEl){
  if (!rows || !rows.length || !tableEl) return;

  const padded = padRows(rows);

  const titleIdx = detectTitleRowIndex(padded);
  const headerIdx = detectHeaderRowIndex(padded, titleIdx === 0 ? 1 : 0);

  const maxCols = padded[0].length;

  // title text（取那列唯一非空 cell）
  let titleText = "";
  if (titleIdx === 0){
    titleText = padded[0].find(c => !isEmptyCell(c)) || "";
  }

  const headers = padded[headerIdx];
  const bodyRows = padded.slice(headerIdx + 1);

  // build THEAD
  const thead = document.createElement("thead");

  if (titleIdx === 0 && titleText){
    const trTitle = document.createElement("tr");
    trTitle.className = "ms-title-row";
    const th = document.createElement("th");
    th.colSpan = maxCols;
    th.textContent = titleText;
    trTitle.appendChild(th);
    thead.appendChild(trTitle);
  }

  const trHead = document.createElement("tr");
  trHead.className = "ms-header-row";
  headers.forEach(h => {
    const th = document.createElement("th");
    th.textContent = String(h || "").trim();
    trHead.appendChild(th);
  });
  thead.appendChild(trHead);

  // build TBODY
  const tbody = document.createElement("tbody");
  bodyRows.forEach(r => {
    const tr = document.createElement("tr");
    r.forEach(c => {
      const td = document.createElement("td");
      const txt = String(c ?? "");
      td.textContent = txt;
      // ✅ 保留空白列高度（不用改 table 結構）
      if (isEmptyCell(txt)) td.innerHTML = "&nbsp;";
      tr.appendChild(td);
    });
    tbody.appendChild(tr);
  });

  tableEl.innerHTML = "";
  tableEl.appendChild(thead);
  tableEl.appendChild(tbody);
}

function updateSectionUI(sec){
  const a = document.getElementById("secTitle");
  const b = document.getElementById("secTitle2");
  if (a) a.textContent = sec;
  if (b) b.textContent = sec;
  document.title = "Maintenance Smart | IO Description List | " + sec;
  // ✅ 同步網址，方便分享連結
  const u = new URL(location.href);
  u.searchParams.set("section", sec);
  history.replaceState(null, "", u.toString());
  
  if (window.parent && window.parent !== window) {
  window.parent.postMessage({ type:"ms-section-change", section: sec }, "*");
  }
}

  function showError(msg){
    const el = $("#errBox");
    el.style.display = "block";
    el.textContent = msg;
  }
  function clearError(){
    const el = $("#errBox");
    el.style.display = "none";
    el.textContent = "";
  }

  function toggleFilters() {
    const box  = document.getElementById("filtersBox");
    const icon = document.getElementById("toggleIcon");
    const isOpen = !box.classList.contains("closed");
    if (isOpen) {
      box.classList.add("closed");
      icon.textContent = "▼";
    } else {
      box.classList.remove("closed");
      icon.textContent = "▲";
    }
  }

  function fillSelect(selectEl, items, keepValue=false){
    const old = selectEl.value;
    selectEl.innerHTML = "";
    items.forEach(v=>{
      const opt = document.createElement("option");
      opt.value = v; opt.textContent = v;
      selectEl.appendChild(opt);
    });
    if (keepValue && items.includes(old)) selectEl.value = old;
    else if(items.length) selectEl.value = items[0];
  }

  // CSV parser (supports quotes)
  function parseCsv(text){
    const rows = [];
    let row = [], cur = "", inQ = false;

    for(let i=0;i<text.length;i++){
      const c = text[i], n = text[i+1];

      if(c === '"'){
        if(inQ && n === '"'){ cur += '"'; i++; }
        else inQ = !inQ;
      } else if(!inQ && c === ','){
        row.push(cur); cur="";
      } else if(!inQ && (c === '\n' || c === '\r')){
        if(c === '\r' && n === '\n') i++;
        row.push(cur); rows.push(row);
        row=[]; cur="";
      } else {
        cur += c;
      }
    }
    if(cur.length || row.length){ row.push(cur); rows.push(row); }

    const header = (rows.shift() || []).map(h => String(h).trim());
    const data = rows
      .filter(r => r.some(x => String(x).trim() !== ""))
      .map(r => {
        const obj = {};
        header.forEach((k,idx)=> obj[k] = (r[idx] ?? "").trim());
        return obj;
      });

    return { header, data };
  }

  async function fetchJson(url){
    const r = await fetch(url, {cache:"no-store"});
    if(!r.ok) throw new Error("Index load failed: " + r.status);
    return r.json();
  }

  async function loadCsv(path){
    const r = await fetch(path, {cache:"no-store"});
    if(!r.ok) throw new Error("CSV load failed: " + r.status + " | " + path);
    const text = await r.text();
    return parseCsv(text);
  }

  function getCsvPath(){
    const m = $("#modSel").value;
    const c = $("#catSel").value;
    const v = $("#verSel").value;

    const node = indexData?.[m]?.[c];
    if(!node) return null;

    return node[v] || node["CSV"] || node["PDF"] || null;
  }

  function setCountInfo(filteredCount, totalCount){
    const el = $("#countInfo");
    if(!el) return;
    if(filteredCount === totalCount) el.textContent = `Total: ${totalCount} records`;
    else el.textContent = `Filter: ${filteredCount} / Total: ${totalCount}`;
  }

  function buildThead(){
    const theadTr = $("#ioTable thead tr");
    theadTr.innerHTML = header.map(h => `<th data-col="${escapeHtml(h)}">${escapeHtml(h)}</th>`).join("");

    // bind sort
    theadTr.querySelectorAll("th[data-col]").forEach(th=>{
      th.addEventListener("click", ()=>{
        const k = th.getAttribute("data-col");
        if(sortKey === k) sortAsc = !sortAsc;
        else { sortKey = k; sortAsc = true; }
        render();
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, m => ({
      "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
    }[m]));
  }

  function render(){
    const q = ($("#searchInput").value || "").trim().toLowerCase();
    let data = [...rowsAll];

    // search
    if(q){
      data = data.filter(obj=>{
        const text = header.map(h=>obj[h] ?? "").join(" ").toLowerCase();
        return text.includes(q);
      });
    }

    // sort
    if(sortKey){
      data.sort((a,b)=>{
        const x = (a[sortKey] ?? "").toString();
        const y = (b[sortKey] ?? "").toString();
        if(x === y) return 0;
        return sortAsc ? x.localeCompare(y, "en") : y.localeCompare(x, "en");
      });
    }

    const tbody = $("#ioTable tbody");
    tbody.innerHTML = "";
    data.forEach(obj=>{
      const tr = document.createElement("tr");
      tr.innerHTML = header.map(h => `<td title="${escapeHtml(obj[h] ?? "")}">${escapeHtml(obj[h] ?? "")}</td>`).join("");
      tbody.appendChild(tr);
    });

    setCountInfo(data.length, rowsAll.length);
  }

  async function refresh(){
    clearError();

    const path = getCsvPath();
    if(!path){
      showError("No file mapping found. Please check index.json for this selection.");
      return;
    }

    $("#fileHint").textContent = path;

    // ✅ PDF handling
    if(/\.(pdf)$/i.test(path)){
      window.open("./" + path, "_blank");
      showError("This item is a PDF. Opened in a new tab.");
      // keep old table
      return;
    }

    const parsed = await loadCsv("./" + path);
    header = parsed.header;
    rowsAll = parsed.data;

    buildThead();
    render();
  }

  async function init(){
    try{
      indexData = await fetchJson(INDEX_URL);

      const wantModules = ["F12","F13","F16","F201"];
      const modules = wantModules.filter(m => indexData[m]);
      fillSelect($("#modSel"), modules.length ? modules : Object.keys(indexData));

      // ✅ support ?section=F12
      const params = new URLSearchParams(location.search);
      const preSection = params.get("section");
      if(preSection && (modules.length ? modules.includes(preSection) : Object.keys(indexData).includes(preSection))){
        $("#modSel").value = preSection;
        updateSectionUI(preSection);
      }


      $("#modSel").addEventListener("change", ()=>{
        const m = $("#modSel").value;
        updateSectionUI(m);
        const cats = Object.keys(indexData[m] || {});
        fillSelect($("#catSel"), cats);

        const c = $("#catSel").value;
        const vers = Object.keys(indexData[m][c] || {});
        fillSelect($("#verSel"), vers);

        sortKey = null; sortAsc = true;
        refresh();
      });

      $("#catSel").addEventListener("change", ()=>{
        const m = $("#modSel").value;
        const c = $("#catSel").value;
        const vers = Object.keys(indexData[m][c] || {});
        fillSelect($("#verSel"), vers);

        sortKey = null; sortAsc = true;
        refresh();
      });

      $("#verSel").addEventListener("change", ()=>{ sortKey=null; sortAsc=true; refresh(); });
      $("#reloadBtn").addEventListener("click", refresh);
      $("#printBtn").addEventListener("click", ()=>window.print());
      $("#searchInput").addEventListener("input", render);

      // initial
      $("#modSel").dispatchEvent(new Event("change"));
    }catch(err){
      showError(String(err));
    }
  }

  document.addEventListener("DOMContentLoaded", init);
</script>

</body>
</html>
