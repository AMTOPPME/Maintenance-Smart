<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Maintenance Smart | Portal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root{
      --bg:#f3f4f6;
      --card-bg:#fff;
      --border-subtle:#e5e7eb;
      --accent:#2563eb;
      --accent-soft:#eff6ff;
      --accent-hover:#1d4ed8;
      --text:#111827;
      --text-soft:#6b7280;
      --radius-xl:18px;
      --shadow-soft-sm:0 10px 26px rgba(15,23,42,.06);
      --shadow-soft-md:0 16px 40px rgba(15,23,42,.09);
      --small-font:13px; --xsmall-font:11px;
    }

    /* style 主題底色（index 用純色，不用圖） */
    html[data-style="panther"]{
      --bg:#ffe4ec;   /* 淡粉 */
    }
    html[data-style="hangyodon"]{
      --bg:#dbeafe;   /* 淡藍 */
    }

    *{box-sizing:border-box}
    body{
      margin:0;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
      font-size:15px;
      color:var(--text);
      background:var(--bg); /* 純顏色背景 */
      min-height:100vh;
      overflow-x:hidden;
      transition:background .25s ease,color .25s ease;
    }

    .page{
      position:relative;
      width:100%;
      max-width:none;
      margin:0;
      padding:24px 16px 40px;
      z-index:2;
    }

    .topbar{
      background:var(--card-bg);
      padding:18px 20px;
      border-radius:22px;
      border:1px solid var(--border-subtle);
      box-shadow:var(--shadow-soft-md);
      display:flex;
      justify-content:space-between;
      gap:14px;
      align-items:flex-start;
      margin-bottom:18px;
      transition:background .25s ease,box-shadow .25s ease,border-color .25s ease;
    }

    /* 左側：品牌 + Modules 按鈕（上下排列） */
    .top-left{
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
      min-height:72px;
    }

    .brand-wrap{display:flex;align-items:center;gap:10px}

    /* 左上主題 icon：藍色主題用漸層方塊，其他主題顯示角色頭像 */
    .mascot{
      width:28px;
      height:28px;
      border-radius:9px;
      background:radial-gradient(circle at 30% 0,#bfdbfe,#2563eb);
      box-shadow:0 0 10px rgba(37,99,235,0.35);
      flex-shrink:0;
      object-fit:cover;
      background-size:cover;
      background-position:center;
    }

    .brand-main{
      font-size:19px;
      font-weight:650;
      letter-spacing:.12em;
      text-transform:uppercase;
      color:var(--text);
      display:flex;
      align-items:center;
      gap:6px
    }
    .brand-sub{font-size:13px;color:var(--text-soft)}

    /* 中間名言區塊 */
    .top-quote {
      text-align:center;
      justify-self:center;
    }

    .quote-label{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.12em;
      color:var(--text-soft);
      margin-bottom:4px;
    }
    .quote-text{
      font-size:18px;
      font-weight:500;
      color:#3b82f6;
      font-style:italic;
      max-width:720px;
      margin:0 auto;
      text-align:left;
      white-space:normal;
      word-wrap:break-word;
    }

    /* Modules 按鈕（topbar 左下角） */
    .menu-button{
      border-radius:999px;
      border:1px solid #e5e7eb;
      background:#eff6ff;
      padding:10px 22px;
      font-size:14px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
      cursor:pointer;
      color:#1d4ed8;
      box-shadow:0 4px 10px rgba(129,140,248,.35);
      transition:all .18s ease;
    }
    .menu-button:hover{
      background:#dbeafe;
      transform:translateY(-1px);
      box-shadow:0 6px 16px rgba(129,140,248,.45);
    }
    .menu-icon{font-size:16px;}

    .top-meta{
      display:flex;
      gap:8px;
      align-items:center;
      font-size:11px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }
    .pill{
      padding:5px 11px;
      border-radius:999px;
      border:1px solid #e5e7eb;
      background:#f9fafb;
      display:inline-flex;
      align-items:center;
      gap:6px;
      transition:background .2s ease,border-color .2s ease,color .2s ease;
    }
    .pill-label{color:var(--text-soft)}
    .pill-strong{color:var(--text);font-weight:500}

    .pill.designer{
      padding:6px 13px;
      border-color:#dbeafe;
      background:#eff6ff;
    }
    .pill-designer-strong{
      font-size:14px;
      font-weight:700;
      letter-spacing:.02em;
      color:var(--text);
    }

    .workspace{
      min-height:60vh;
    }

    .main{
      flex:1;
      min-width:0;
    }

    .section-head{
      margin-bottom:10px;
      display:flex;
      justify-content:space-between;
      align-items:flex-end;
      gap:10px;
      flex-wrap:wrap;
    }
    .section-title{font-size:18px;font-weight:600;color:var(--text);margin:0}
    .section-sub{font-size:var(--small-font);color:var(--text-soft);margin:2px 0 0}

    /* iframe 區域 */
    .iframe-wrap{
      background:var(--card-bg);
      border-radius:var(--radius-xl);
      border:1px solid var(--border-subtle);
      box-shadow:var(--shadow-soft-sm);
      overflow:hidden;
      height:calc(100vh - 170px);
    }
    .iframe-wrap iframe{
      width:100%;
      height:100%;
      min-height:0;
      border:0;
      display:block;
      background:#111827;
    }

    /* Modules 展開面板 */
    .nav-panel{
      position:absolute;
      left:24px;
      top:calc(24px + 72px);
      max-width:260px;
      background:rgba(255,255,255,0.97);
      border-radius:18px;
      padding:10px 6px 10px;
      box-shadow:var(--shadow-soft-md);
      border:1px solid var(--border-subtle);
      backdrop-filter:blur(12px);
      z-index:10;
      display:none;
      max-height:70vh;
      overflow-y:auto;
    }
    .nav-panel.open{
      display:block;
    }

    .nav-list{
      list-style:none;
      padding:0;
      margin:0;
      display:flex;
      flex-direction:column;
      gap:4px;
    }

    .nav-item-btn{
      width:100%;
      border:none;
      border-radius:999px;
      padding:8px 10px;
      background:transparent;
      display:flex;
      align-items:center;
      gap:8px;
      cursor:pointer;
      font-size:13px;
      color:var(--text-soft);
      transition:background .15s ease,color .15s ease,transform .1s ease;
      text-align:left;
      white-space:nowrap;
      overflow:hidden;
    }
    .nav-icon{
      font-size:18px;
      flex-shrink:0;
    }
    .nav-label{
      flex:1;
      text-overflow:ellipsis;
      overflow:hidden;
    }
    .nav-item-btn:hover{
      background:var(--accent-soft);
      color:var(--accent);
      transform:translateY(-1px);
    }
    .nav-item-btn.active{
      background:var(--accent);
      color:#fff;
      box-shadow:0 4px 10px rgba(37,99,235,.35);
    }

    .nav-group-schematic .nav-item-btn,
    .nav-group-maintenance .nav-item-btn{
      justify-content:space-between;
    }
    .nav-chevron{
      font-size:14px;
      opacity:.7;
    }

    .schematic-panel,
    .maintenance-panel{
      margin-top:4px;
      margin-left:26px;
      padding:8px 10px 10px;
      background:rgba(249,250,251,0.98);
      border-radius:14px;
      border:1px solid var(--border-subtle);
      box-shadow:0 8px 18px rgba(15,23,42,.04);
      display:none;
    }
    .schematic-panel.open,
    .maintenance-panel.open{
      display:block;
    }

    .schematic-title,
    .maintenance-title{
      font-size:11px;
      font-weight:600;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text-soft);
      margin-bottom:6px;
    }

    /* SECTION：藍色主按鍵 */
    .schematic-sec-row{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .schematic-sec-btn{
      border-radius:999px;
      border:1px solid transparent;
      background:#eff6ff;
      padding:4px 10px;
      font-size:11px;
      cursor:pointer;
      color:#1d4ed8;
      display:inline-flex;
      align-items:center;
      gap:4px;
      transition:background .15s,border-color .15s,color .15s,transform .1s;
    }
    .schematic-sec-btn span.code{
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:11px;
    }
    .schematic-sec-btn:hover{
      background:#dbeafe;
      transform:translateY(-1px);
    }
    .schematic-sec-btn.active{
      background:#1d4ed8;
      border-color:#1d4ed8;
      color:#fff;
      box-shadow:0 3px 8px rgba(37,99,235,.4);
    }

    /* LINE：2x2、灰色按鍵 */
    .schematic-line-row{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
      margin-bottom:6px;
    }
    .schematic-line-btn{
      flex:1 1 calc(50% - 6px);
      border-radius:999px;
      border:1px solid var(--border-subtle);
      background:#f9fafb;
      padding:6px 0;
      font-size:11px;
      cursor:pointer;
      color:var(--text-soft);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:4px;
      transition:background .15s,border-color .15s,color .15s,transform .1s;
      text-align:center;
    }
    .schematic-line-btn:hover{
      background:#fff;
      border-color:var(--accent-soft);
      color:var(--accent);
      transform:translateY(-1px);
    }
    .schematic-line-btn.active{
      background:#fff;
      border-color:var(--accent);
      color:var(--accent);
      box-shadow:0 3px 8px rgba(37,99,235,.25);
    }

    /* Maintenance 按鈕（維持原本灰色） */
    .maintenance-sec-row{
      display:flex;
      flex-wrap:wrap;
      gap:6px;
    }
    .maintenance-sec-btn{
      border-radius:999px;
      border:1px solid var(--border-subtle);
      background:#f9fafb;
      padding:4px 10px;
      font-size:11px;
      cursor:pointer;
      color:var(--text-soft);
      display:inline-flex;
      align-items:center;
      gap:4px;
      transition:background .15s,border-color .15s,color .15s,transform .1s;
    }
    .maintenance-sec-btn span.code{
      font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size:11px;
    }
    .maintenance-sec-btn:hover{
      background:#fff;
      border-color:var(--accent-soft);
      color:var(--accent);
      transform:translateY(-1px);
    }
    .maintenance-sec-btn.active{
      background:#1d4ed8;
      border-color:#1d4ed8;
      color:#fff;
      box-shadow:0 3px 8px rgba(37,99,235,.4);
    }

    .schematic-hint{
      margin-top:6px;
      font-size:10px;
      color:var(--text-soft);
    }

    /* Line Schematic → Tags list 區塊 */
    .ls-tags{
      margin-top:6px;
      padding-top:6px;
      border-top:1px dashed rgba(148,163,184,.7);
      font-size:11px;
    }
    .ls-tags .ls-label{
      font-size:10px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text-soft);
      margin-bottom:4px;
    }
    .ls-tags .ls-tag-link{
      display:inline-flex;
      align-items:center;
      gap:4px;
      padding:4px 10px;
      border-radius:999px;
      background:var(--accent-soft);
      color:var(--accent);
      text-decoration:none;
      border:1px solid rgba(37,99,235,.25);
      cursor:pointer;
      transition:background .15s ease,border-color .15s ease,color .15s ease,transform .1s ease;
    }
    .ls-tags .ls-tag-link:hover{
      background:var(--accent-hover);
      color:#fff;
      border-color:var(--accent-hover);
      transform:translateY(-1px);
    }

    @media (max-width:900px){
      .page{
        padding-top:16px;
        padding-bottom:24px;
      }

      .topbar{
        display:flex;
        flex-direction:column;
        align-items:flex-start;
        gap:10px;
        padding:14px 14px 18px;
      }

      .top-left{
        display:contents;
        min-height:0;
      }

      .brand-main{
        font-size:17px;
        letter-spacing:.10em;
      }

      .brand-sub{
        font-size:12px;
      }

      .top-quote{
        width:100%;
        text-align:left;
        padding:4px 0 0;
        order:3;
      }

      .top-meta{
        width:100%;
        justify-content:flex-start;
        gap:6px;
        flex-wrap:wrap;
        order:2;
      }

      .top-meta .pill{
        flex-shrink:0;
      }

      .menu-button{
        order:4;
        align-self:stretch;
        justify-content:center;
        text-align:center;
        margin-top:4px;
      }

      .nav-panel{
        position:relative;
        left:0;
        top:0;
        width:100%;
        max-width:none;
        margin-top:8px;
      }

      .schematic-panel,
      .maintenance-panel{
        margin-left:0;
      }

      .iframe-wrap{
        height:calc(100vh - 220px);
      }
    }
  </style>
</head>
<body>

        <!-- Maintenance Records -->

          <button
            class="nav-item-btn"
            data-src="Maintenance_Records.html"

    <div class="workspace">

        <div class="iframe-wrap">
          <iframe id="mainFrame" title="Module view" src="Home.html"></iframe>
        </div>

<script>
  /* ---------- Modified Date ---------- */
  (function () {
    function updateModDate() {
      var el = document.getElementById('modDate');
      if (!el) return;

      var d = new Date(document.lastModified);
      if (isNaN(d.getTime())) {
        el.textContent = 'N/A';
        return;
      }

      el.textContent = d.toLocaleString([], {
        year:'numeric',
        month:'2-digit',
        day:'2-digit',
        hour:'2-digit',
        minute:'2-digit'
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', updateModDate);
    } else {
      updateModDate();
    }
  })();
</script>

<script>
  // 名言輪播：50 句，每 2 分鐘換一個
  (function(){
    const QUOTE_INTERVAL_MS = 120000; // 2 分鐘
    const el = document.getElementById('topQuote');
    if (!el) return;

    const quotes = [
      `Tell me and I forget. Teach me and I remember. Involve me and I learn. — Benjamin Franklin`,
      `A pessimist is one who makes difficulties of his opportunities and an optimist is one who makes opportunities of his difficulties. — Harry S. Truman`,
      `Always remember that you are absolutely unique. Just like everyone else. — Margaret Mead`,

<script>
  // ---- 子頁面同步主頁 style ----
  (function syncStyleToIframe(){
    const frame = document.getElementById("mainFrame");

    function applyStyleToFrame(){
      if (!frame || !frame.contentDocument) return;
      const style = document.documentElement.getAttribute("data-style") || "blue";
      const frameHtml = frame.contentDocument.documentElement;
      frameHtml.setAttribute("data-style", style);
    }

    if (frame){
      frame.addEventListener("load", function(){
        setTimeout(applyStyleToFrame, 30);
      });
    }

    window._msSyncFrameStyle = applyStyleToFrame;
  })();

 // Modules 面板開關
  (function(){
    const menuBtn = document.getElementById('menuButton');
    const panel   = document.getElementById('navPanel');
    if (!menuBtn || !panel) return;

    const isTouchDevice =
      ('ontouchstart' in window) ||
      (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

    let mainHideTimer = null;

    function openPanel(){
      panel.classList.add('open');
      menuBtn.setAttribute('aria-expanded', 'true');
    }

    function closePanel(){
      panel.classList.remove('open');
      menuBtn.setAttribute('aria-expanded', 'false');
    }

    function clearMainHideTimer(){
      if (mainHideTimer){
        clearTimeout(mainHideTimer);
        mainHideTimer = null;
      }
    }

    // 👇 Modules List 離開後 2 秒才關閉
    function scheduleMainHide(){
      clearMainHideTimer();
      mainHideTimer = setTimeout(closePanel, 2000); // 2 秒
    }

    function togglePanel(){
      const isOpen = panel.classList.contains('open');
      if (isOpen) closePanel(); else openPanel();
    }

    // 📱 手機 / 平板：點一下展開 / 收起
    menuBtn.addEventListener('click', togglePanel);

    // 點擊頁面其他地方就關閉（立刻關）
    document.addEventListener('click', (e)=>{
      if (!panel.classList.contains('open')) return;
      const insidePanel = panel.contains(e.target);
      const insideBtn   = menuBtn.contains(e.target);
      if (!insidePanel && !insideBtn){
        closePanel();
      }
    });

    // 🖥️ 桌機：hover 展開，移出 2 秒後關閉
    if (!isTouchDevice){
      // 滑到「Modules」→ 展開
      menuBtn.addEventListener('mouseenter', ()=>{
        clearMainHideTimer();
        openPanel();
      });

      // 從 Modules 離開，看是不是跑到 panel 裡
      menuBtn.addEventListener('mouseleave', (e)=>{
        const toElement = e.relatedTarget;
        if (toElement && panel.contains(toElement)) return; // 進入 panel，不關
        scheduleMainHide();
      });

      // 滑到 panel → 保持開啟
      panel.addEventListener('mouseenter', ()=>{
        clearMainHideTimer();
      });

      // 從 panel 離開 → 開始 2 秒倒數
      panel.addEventListener('mouseleave', (e)=>{
        const toElement = e.relatedTarget;
        if (toElement && menuBtn.contains(toElement)) return; // 回到按鈕，不關
        scheduleMainHide();
      });
    }
  })();
  
// 切換模組 + Line Schematic / Maintenance 兩層選單
(function(){
  const frame   = document.getElementById('mainFrame');
  const titleEl = document.getElementById('moduleTitle');
  const subEl   = document.getElementById('moduleSub');
  const panel   = document.getElementById('navPanel');
  const menuBtn = document.getElementById('menuButton');
  const buttons = document.querySelectorAll('.nav-item-btn');

  // 父按鈕：Line Schematic / Maintenance
  const schematicParentBtn   = document.querySelector('[data-role="schematic-parent"]');
  const maintenanceParentBtn = document.querySelector('[data-role="maintenance-parent"]');

  const schematicPanel     = document.getElementById('schematicPanel');
  const schematicLineBtns  = document.querySelectorAll('.schematic-line-btn');
  const schematicSecBtns   = document.querySelectorAll('.schematic-sec-btn');
  let currentSchematicLine    = null;
  let currentSchematicSection = null;

  const maintenancePanel   = document.getElementById('maintenancePanel');
  const maintenanceSecBtns = document.querySelectorAll('.maintenance-sec-btn');

  // 只有桌機才啟用 hover 子列表
  const isTouchDevice =
    ('ontouchstart' in window) ||
    (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

  // --- 子列表 hover 開關（0.8 秒關閉） ---
  const schematicGroup   = document.querySelector('.nav-group-schematic');
  const maintenanceGroup = document.querySelector('.nav-group-maintenance');

  if (!isTouchDevice){
    let schematicTimer = null;
    let maintenanceTimer = null;

    if (schematicGroup && schematicPanel){
      schematicGroup.addEventListener('mouseenter', () => {
        clearTimeout(schematicTimer);
        schematicPanel.classList.add('open');
      });
      schematicGroup.addEventListener('mouseleave', () => {
        clearTimeout(schematicTimer);
        schematicTimer = setTimeout(()=>{
          schematicPanel.classList.remove('open');
        }, 800); // 0.8 秒
      });
    }

    if (maintenanceGroup && maintenancePanel){
      maintenanceGroup.addEventListener('mouseenter', () => {
        clearTimeout(maintenanceTimer);
        maintenancePanel.classList.add('open');
      });
      maintenanceGroup.addEventListener('mouseleave', () => {
        clearTimeout(maintenanceTimer);
        maintenanceTimer = setTimeout(()=>{
          maintenancePanel.classList.remove('open');
        }, 800); // 0.8 秒
      });
    }
  }


  // 共用 helper
  function activateNav(btn){
    buttons.forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
  }

  function closeAllSubPanels(){
    if (schematicPanel)   schematicPanel.classList.remove('open');
    if (maintenancePanel) maintenancePanel.classList.remove('open');
  }

  function setModule(title, sub){
    if (titleEl) titleEl.textContent = title;
    if (subEl)   subEl.textContent   = sub;
  }

  function formatLineLabel(lineKey){
    if (lineKey.startsWith('Line')) return lineKey.replace('Line','Line ');
    return lineKey;
  }

  // Schematic 檔名規則：Line-1-4-Schematic.html?line=1&sec=F13
  function buildSchematicFileName(lineKey, sectionKey){
    const n = lineKey.replace('Line',''); // Line1 -> 1
    return 'Line-1-4-Schematic.html?line=' + n + '&sec=' + sectionKey;
  }

  // 點擊父按鈕：正式切到該模組
  function openSchematicParent(btn){
    if (!schematicPanel) return;
    activateNav(btn);
    closeAllSubPanels();
    schematicPanel.classList.add('open');
    setModule(
      btn.dataset.title || 'Line Schematic',
      btn.dataset.sub   || 'Select section (F12/F13/F16/F201) then line (1~4).'
    );
  }

  function openMaintenanceParent(btn){
    if (!maintenancePanel) return;
    activateNav(btn);
    closeAllSubPanels();
    maintenancePanel.classList.add('open');
    setModule(
      btn.dataset.title || 'Maintenance',
      btn.dataset.sub   || 'Open maintenance SOP PDFs.'
    );
  }

  // 主模組切換（Home / PC Manager / Records / Report）
  buttons.forEach(btn => {
    const role = btn.dataset.role || '';

    // 點擊行為（手機 + 桌機）
    btn.addEventListener('click', () => {
      const roleClick = btn.dataset.role || '';

      if (roleClick === 'schematic-parent'){
        openSchematicParent(btn);
        return;
      }

      if (roleClick === 'maintenance-parent'){
        openMaintenanceParent(btn);
        return;
      }

      // 一般按鈕
      const src = btn.dataset.src;
      if (!src) return;

      activateNav(btn);

      const title = btn.dataset.title || 'Module';
      const sub   = btn.dataset.sub || '';
      if (frame) frame.src = src;
      setModule(title, sub);

      if (panel && panel.classList.contains('open')){
        panel.classList.remove('open');
        if (menuBtn) menuBtn.setAttribute('aria-expanded','false');
      }

      closeAllSubPanels();
    });

    // ❌ 這裡就不用再做 hover 開關子列表了，交給上面 group 的 mouseenter/leave
  });

  // Line Schematic：Line 1~4
  schematicLineBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const lineKey = btn.getAttribute('data-line');
      if (!lineKey) return;

      // 點任一 LINE → Line Schematic 當前模組（藍色 active）
      if (schematicParentBtn) {
        activateNav(schematicParentBtn);
      }

      currentSchematicLine = lineKey;

      schematicLineBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');

      // 還沒選 section 就先不要開檔
      if (!currentSchematicSection) return;

      const file = buildSchematicFileName(currentSchematicLine, currentSchematicSection);
      if (frame) frame.src = file;

      const lineLabel = formatLineLabel(currentSchematicLine);
      setModule(
        'Line Schematic – ' + lineLabel + ' – ' + currentSchematicSection,
        'Schematic file: ' + file
      );
    });
  });

  // Line Schematic：Section F12/F13/F16/F201
  schematicSecBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const sectionKey   = btn.getAttribute('data-section');
      const sectionLabel = btn.getAttribute('data-label') || sectionKey || '';
      if (!sectionKey) return;

      // 點 SECTION 也算在用 Line Schematic
      if (schematicParentBtn) {
        activateNav(schematicParentBtn);
      }

      currentSchematicSection = sectionKey;

      // 切換 section 時，LINE 完全重置
      currentSchematicLine = null;
      schematicLineBtns.forEach(b=>b.classList.remove('active'));

      setModule(
        'Line Schematic – ' + sectionLabel,
        'Select LINE to open schematic.'
      );
    });
  });

  // Maintenance：開 Maintenance.html（裡面再用 pdf.js）
  maintenanceSecBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key   = btn.getAttribute('data-pdf-key');
      const label = btn.getAttribute('data-label') || key || '';
      if (!key) return;

      // 點任一 PDF → Maintenance 當前模組（藍色 active）
      if (maintenanceParentBtn) {
        activateNav(maintenanceParentBtn);
      }

      const viewerUrl = 'Maintenance.html?key=' + encodeURIComponent(key);

      if (frame){
        frame.src = viewerUrl;
      }

      setModule(
        'Maintenance – ' + label,
        'PDF: ' + label
      );

      maintenanceSecBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // Tags list：載入到右側 iframe
  const tagsLink = document.getElementById('tagsListLink');
  if (tagsLink) {
    tagsLink.addEventListener('click', function (e) {
      e.preventDefault();

      if (frame) frame.src = 'F13_PLC_Tags list.html';
      setModule('Tags List', 'PLC / SCADA Tag Reference');
    });
  }
})();

  // Style Theme (blue / panther / hangyodon) – 點左上 icon 切換
  (function(){
    const STYLE_KEY = 'ms-style';
    const root = document.documentElement;
    const mascot = document.querySelector('.mascot');
    const styles = ['blue', 'panther', 'hangyodon'];

    const themeConfig = {
      blue:     { bgImage: '' },
      panther:  { bgImage: 'url("pinkpanther.png")' },
      hangyodon:{ bgImage: 'url("hangyodon.png")' }
    };

    function applyStyle(style){
      const s = themeConfig[style] ? style : 'blue';
      root.setAttribute('data-style', s);
      const cfg = themeConfig[s];

      if (mascot){
        mascot.style.backgroundImage = cfg.bgImage || '';
      }

      localStorage.setItem(STYLE_KEY, s);

      if (window._msSyncFrameStyle){
        setTimeout(window._msSyncFrameStyle, 30);
      }
    }

    function cycleStyle(){
      const current = root.getAttribute('data-style') || 'blue';
      const idx = styles.indexOf(current);
      const next = styles[(idx + 1) % styles.length];
      applyStyle(next);
    }

    const saved = localStorage.getItem(STYLE_KEY) || 'blue';
    applyStyle(saved);

    if (mascot){
      mascot.style.cursor = 'pointer';
      mascot.title = 'Click to change style';
      mascot.addEventListener('click', cycleStyle);
    }
  })();
</script>
